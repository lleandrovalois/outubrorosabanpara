server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    root /usr/share/nginx/html;
    index index.html base-site.html;
    charset utf-8;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/x-javascript application/xml+rss image/svg+xml;

    # Cabeçalhos de Segurança Básicos
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Rota Principal
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Atalho para o Portal Base Banpará
    location /portal {
        rewrite ^/portal/?$ /base-site.html permanent;
    }

    # Cache de Ativos Estáticos (Imagens, Fontes, etc.)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Cache de CSS e JS
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Desativa log de favicon e robots ausentes
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # Tratamento de Erros
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
